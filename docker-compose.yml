services:
  # ─── WhatsApp Bot Service ───────────────────────────────────────────────
  whatsapp-bot:
    build: .
    container_name: ${STACK_NAME:-whatsapp-bot}
    restart: unless-stopped

    expose:
      - "3000"

    env_file:
      - path: .env
        required: false

    environment:
      - PORT=3000
      - PREFIX=${PREFIX:-.}
      - OWNER_NUMBER=${OWNER_NUMBER:-}
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      - DASHBOARD_PASS=${DASHBOARD_PASS:-}
      - SUPERADMIN_USER=${SUPERADMIN_USER:-superadmin}
      - SUPERADMIN_PASS=${SUPERADMIN_PASS:-}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-}
      - BOT_DOMAIN=${BOT_DOMAIN:-bot.craveycrust.com}
      - SERVER_IP=${SERVER_IP:-localhost}
      # ── Database Connection (Uses internal service hostname on default network) ─
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-cravey}:${POSTGRES_PASSWORD}@cravey-postgres:5432/${POSTGRES_DB:-cravey_crust}?schema=public}
      - REDIS_URL=${REDIS_URL:-}
      # ── Feature Flags ────────────────────────────────────────────────────
      - RESTAURANT_DB_ENABLED=${RESTAURANT_DB_ENABLED:-true}
      - CORE_ORDER_ENGINE_ENABLED=${CORE_ORDER_ENGINE_ENABLED:-true}
      - CUSTOM_AI_ENABLED=${CUSTOM_AI_ENABLED:-false}
      - REALTIME_DASHBOARD_ENABLED=${REALTIME_DASHBOARD_ENABLED:-true}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      - N8N_ENABLED=${N8N_ENABLED:-false}
      - N8N_INTEGRATION_ENABLED=${N8N_INTEGRATION_ENABLED:-false}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-}
      - N8N_BOT_SECRET=${N8N_BOT_SECRET:-}
      - N8N_TIMEOUT=${N8N_TIMEOUT:-10000}
      - KNOWLEDGE_BASE_ENABLED=${KNOWLEDGE_BASE_ENABLED:-true}
      - WHATSAPP_ORDERING_ENABLED=${WHATSAPP_ORDERING_ENABLED:-true}
      # ── AI Configuration ─────────────────────────────────────────────────
      - STANDALONE_AI_ENABLED=${STANDALONE_AI_ENABLED:-true}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - AI_PRIMARY_PROVIDER=${AI_PRIMARY_PROVIDER:-gemini}
      - AI_FALLBACK_PROVIDER=${AI_FALLBACK_PROVIDER:-gemini}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.2}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-1024}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_API_KEYS=${GEMINI_API_KEYS:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
      - DEEPSEEK_API_KEYS=${DEEPSEEK_API_KEYS:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_KEYS=${OPENAI_API_KEYS:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}

    volumes:
      - auth_data:/app/auth
      - downloads_data:/app/downloads
      - uploads_data:/app/uploads

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${STACK_NAME:-whatsapp-bot}.rule=Host(`${BOT_DOMAIN:-bot.craveycrust.com}`)"
      - "traefik.http.routers.${STACK_NAME:-whatsapp-bot}.entrypoints=websecure"
      - "traefik.http.routers.${STACK_NAME:-whatsapp-bot}.tls=true"
      - "traefik.http.routers.${STACK_NAME:-whatsapp-bot}.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.${STACK_NAME:-whatsapp-bot}.service=${STACK_NAME:-whatsapp-bot}"
      - "traefik.http.services.${STACK_NAME:-whatsapp-bot}.loadbalancer.server.port=3000"
      - "traefik.http.services.${STACK_NAME:-whatsapp-bot}.loadbalancer.server.scheme=http"
      - "traefik.http.services.${STACK_NAME:-whatsapp-bot}.loadbalancer.passHostHeader=true"
      - "traefik.docker.network=n8n_default"

    networks:
      - default
      - n8n_default

    stdin_open: true
    tty: true

    depends_on:
      cravey-postgres:
        condition: service_healthy

  # ─── PostgreSQL Database ─────────────────────────────────────────────────
  cravey-postgres:
    image: postgres:16-alpine
    container_name: ${STACK_NAME:-cravey}-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cravey_crust}
      POSTGRES_USER: ${POSTGRES_USER:-cravey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cravey_secure_pass_2026}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cravey} -d${POSTGRES_DB:-cravey_crust}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - default
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"

  # ─── Redis (session/cache layer) ─────────────────────────────────────────
  cravey-redis:
    image: redis:7-alpine
    container_name: ${STACK_NAME:-cravey}-redis
    restart: unless-stopped

    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-cravey_redis_pass_2026} --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1 --loglevel warning

    volumes:
      - redis_data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-cravey_redis_pass_2026}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

    networks:
      - default

networks:
  default:
    driver: bridge
  n8n_default:
    external: true

volumes:
  auth_data:
    driver: local
  downloads_data:
    driver: local
  uploads_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
