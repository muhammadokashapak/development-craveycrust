services:
  # ─── WhatsApp Bot (existing service — no breaking changes) ────────────────
  whatsapp-bot:
    build: .
    container_name: whatsapp-bot
    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - path: .env
        required: false

    environment:
      # ── Existing bot vars (unchanged) ────────────────────────
      - PORT=${PORT:-3000} - PREFIX=${PREFIX:-.}
      - OWNER_NUMBER=${OWNER_NUMBER:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      - DASHBOARD_PASS=${DASHBOARD_PASS:-xortlogix}
      - N8N_ENABLED=${N8N_ENABLED:-false}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-https://n8n.srv2029678.hstgr.cloud/webhook/whatsapp-incoming}
      - N8N_BOT_SECRET=${N8N_BOT_SECRET:-my-test-secret-123}
      - N8N_TIMEOUT=${N8N_TIMEOUT:-10000} - SERVER_IP=${SERVER_IP:-localhost}
      # ── Phase 1: Database (Fixed variable name) ────
      - DATABASE_URL=${DATABASE_URL:-postgresql://cravey:change-this-strong-password-minimum-32-chars@cravey-postgres:5432/cravey_crust}
      - REDIS_URL=${REDIS_URL:-}
      # ── Feature Flags (core hardened defaults) ───────────────────────────
      - RESTAURANT_DB_ENABLED=${RESTAURANT_DB_ENABLED:-true}
      - CORE_ORDER_ENGINE_ENABLED=${CORE_ORDER_ENGINE_ENABLED:-true}
      - CUSTOM_AI_ENABLED=${CUSTOM_AI_ENABLED:-false}
      - REALTIME_DASHBOARD_ENABLED=${REALTIME_DASHBOARD_ENABLED:-true}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-bot-internal-secret-phase2}
      - N8N_INTEGRATION_ENABLED=${N8N_INTEGRATION_ENABLED:-false}
      - KNOWLEDGE_BASE_ENABLED=${KNOWLEDGE_BASE_ENABLED:-true}
      - WHATSAPP_ORDERING_ENABLED=${WHATSAPP_ORDERING_ENABLED:-true}
      # ── AI Configuration ─────────────────────────────────────────
      - STANDALONE_AI_ENABLED=${STANDALONE_AI_ENABLED:-true}
      - AI_PRIMARY_PROVIDER=${AI_PRIMARY_PROVIDER:-gemini}
      - AI_FALLBACK_PROVIDER=${AI_FALLBACK_PROVIDER:-gemini}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.2}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-1024} - GEMINI_API_KEYS=${GEMINI_API_KEYS:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
      - DEEPSEEK_API_KEYS=${DEEPSEEK_API_KEYS:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - OPENAI_API_KEYS=${OPENAI_API_KEYS:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - BOT_DOMAIN=${BOT_DOMAIN:-localhost}

    volumes:
      - ./auth:/app/auth
      - ./downloads:/app/downloads
      - ./uploads:/app/uploads

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whatsapp-bot.rule=Host(`${BOT_DOMAIN:-localhost}`)"
      - "traefik.http.routers.whatsapp-bot.entrypoints=websecure"
      - "traefik.http.routers.whatsapp-bot.tls=true"
      - "traefik.http.routers.whatsapp-bot.tls.certresolver=mytlschallenge"
      - "traefik.http.services.whatsapp-bot.loadbalancer.server.port=3000"
      - "traefik.docker.network=n8n_default"

    networks:
      - default
      - n8n_default

    stdin_open: true
    tty: true

    depends_on:
      - cravey-postgres

  cravey-postgres:
    image: postgres:16-alpine
    container_name: cravey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-cravey_crust}
      POSTGRES_USER:     ${POSTGRES_USER:-cravey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-strong-password-in-env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cravey} -d${POSTGRES_DB:-cravey_crust}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - default
    ports:
      - "127.0.0.1:5432:5432"

  cravey-redis:
    image: redis:7-alpine
    container_name: cravey-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-change-this-redis-password-in-env}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-this-redis-password-in-env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default

networks:
  n8n_default:
    external: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
